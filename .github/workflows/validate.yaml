name: Validate

on: [push, pull_request]

permissions:
  contents: read

env:
  FORCE_COLOR: true

jobs:
  build-swift:
    name: Build Swift
    runs-on: macOS-latest
    steps:
    - name: sync repo
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: true
        persist-credentials: false
    - name: Build
      run: swift build

  test-swift:
    name: Test Swift
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: true
        persist-credentials: false
    - name: Test
      run: swift test

  test-cocoapods:
    name: Test CocoaPods (${{ matrix.linkage }})
    runs-on: macOS-latest
    strategy:
      matrix:
        include:
        - linkage: dynamic frameworks
          flags: ''
        - linkage: static frameworks
          flags: --use-static-frameworks
        - linkage: static libraries
          flags: --use-libraries
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: true
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: '3.3'
    - name: Install CocoaPods
      run: gem install cocoapods --version 1.16.2 --no-document
    - name: Check sources against SwiftPM
      run: ruby connections/swift/CocoaPods/check_sources.rb
    - name: Build and test consumer
      run: >-
        pod lib lint NearbyConnections.podspec --platforms=ios
        --include-podspecs=NearbyCoreAdapter.podspec --test-specs=Tests
        --external-podspecs='{NearbyAbseil,NearbyBoringSSL}.podspec'
        ${{ matrix.flags }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Build Connections
      run: CC=clang-18 CXX=clang-18++ BAZEL_CXXOPTS="-std=c++20" bazel build --@com_google_protobuf//bazel/toolchains:prefer_prebuilt_protoc=true --copt='-DGITHUB_BUILD' //connections:core
